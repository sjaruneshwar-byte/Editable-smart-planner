<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDE Roadmap Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">⚡ SDE Roadmap</div>
    <div class="header-stats">
      <div class="stat-pill"><span class="stat-dot" style="background:var(--dsa)"></span><span id="hd-done">0</span> / <span id="hd-total">55</span> Days</div>
      <div class="stat-pill"><span class="stat-dot" style="background:var(--done)"></span>Today: <span id="hd-today">Apr 18</span></div>
    </div>
  </div>
</header>

<div class="progress-bar-wrap">
  <div class="progress-bar-inner">
    <span class="progress-label">Progress</span>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <span class="progress-pct" id="progress-pct">0%</span>
  </div>
</div>

<div class="tabs-row">
  <button class="tab-btn active" onclick="switchTab('today')">📅 Today</button>
  <button class="tab-btn" onclick="switchTab('calendar')">🗓 Calendar</button>
  <button class="tab-btn" onclick="switchTab('stats')">📊 Stats</button>
  <button class="tab-btn" onclick="switchTab('edit')">✏️ Edit Plan</button>
</div>

<div class="main">

  <!-- TODAY PANEL -->
  <div class="panel active" id="panel-today">
    <div id="today-header" style="margin-bottom:20px"></div>
    <div class="today-section" id="today-cards"></div>
    <div style="text-align:center; margin-top: 16px;">
      <button class="btn btn-done" id="today-mark-btn" onclick="toggleTodayDone()">✅ Mark Today Complete</button>
    </div>
  </div>

  <!-- CALENDAR PANEL -->
  <div class="panel" id="panel-calendar">
    <div class="filter-row">
      <button class="filter-btn active" onclick="filterCalendar('all', this)">All</button>
      <button class="filter-btn" onclick="filterCalendar('pending', this)">⏳ Pending</button>
      <button class="filter-btn" onclick="filterCalendar('done', this)">✅ Done</button>
    </div>
    <div id="calendar-container"></div>
  </div>

  <!-- STATS PANEL -->
  <div class="panel" id="panel-stats">
    <div id="streak-section" style="margin-bottom:24px"></div>
    <div class="stats-grid" id="stats-grid"></div>
    <div class="heatmap-section">
      <div class="section-title">📅 Activity Heatmap</div>
      <div class="heatmap-grid" id="heatmap"></div>
    </div>
    <div class="breakdown-grid" id="breakdown-grid"></div>
  </div>

  <!-- EDIT PANEL -->
  <div class="panel" id="panel-edit">
    <div class="edit-toolbar">
      <div>
        <div style="font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800">✏️ Edit Your Plan</div>
        <div style="font-size:0.78rem;color:var(--muted);margin-top:2px">Add, edit or delete days and tasks</div>
      </div>
      <button class="btn btn-primary" onclick="openAddDayModal()">＋ Add New Day</button>
    </div>
    <div id="edit-container"></div>
  </div>

</div>

<!-- ADD DAY MODAL -->
<div class="modal-overlay" id="add-day-overlay" onclick="closeAddDayModal(event)">
  <div class="modal" id="add-day-modal">
    <button class="modal-close" onclick="closeAddDayModalDirect()">✕</button>
    <div id="add-day-content"></div>
  </div>
</div>

<!-- DAY DETAIL MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
